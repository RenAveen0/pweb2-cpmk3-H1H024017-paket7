<h1 class="h3 mb-3">Check-in Peserta</h1>

<div class="card border-0 shadow-sm mb-4">
    <div class="card-body">
        <form method="POST" action="/checkin" class="row g-2 align-items-end" novalidate>
            <input type="hidden" name="_csrf" value="{{.CsrfToken}}">
            <div class="col-md-6 col-lg-4">
                <label for="ticket_code" class="form-label">Kode Tiket</label>
                <input type="text" id="ticket_code" name="ticket_code" maxlength="20" autofocus autocomplete="off"
                       class="form-control form-control-lg text-uppercase" placeholder="contoh: K7M2QX9A">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary btn-lg"><i class="bi bi-check2-circle"></i> Tandai Hadir</button>
            </div>
        </form>
    </div>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-header bg-white fw-semibold"><i class="bi bi-bar-chart"></i> Rekap Kehadiran per Seminar</div>
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
                <tr><th>Seminar</th><th>Tanggal</th><th class="text-center">Terdaftar</th><th class="text-center">Hadir</th><th style="min-width:160px">Kehadiran</th><th class="text-end">Export</th></tr>
            </thead>
            <tbody>
                {{range .Recap}}
                <tr>
                    <td><a href="/seminars/{{.ID}}" class="text-decoration-none">{{.Title}}</a></td>
                    <td class="text-nowrap">{{tanggal .EventDate}}</td>
                    <td class="text-center">{{.Registered}}</td>
                    <td class="text-center">{{.Attended}}</td>
                    <td>
                        {{$pct := .Percent}}
                        <div class="progress" style="height:10px" role="progressbar" aria-valuenow="{{$pct}}" aria-valuemin="0" aria-valuemax="100">
                            <div class="progress-bar bg-primary" style="width: {{$pct}}%"></div>
                        </div>
                        <small class="text-muted">{{$pct}}%</small>
                    </td>
                    <td class="text-end"><a href="/seminars/{{.ID}}/export" class="btn btn-sm btn-outline-success" title="Export CSV daftar hadir"><i class="bi bi-filetype-csv"></i></a></td>
                </tr>
                {{else}}
                <tr><td colspan="6" class="text-center text-muted py-4">Belum ada seminar.</td></tr>
                {{end}}
            </tbody>
        </table>
    </div>
</div>
