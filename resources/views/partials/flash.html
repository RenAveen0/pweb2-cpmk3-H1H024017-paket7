{{if .FlashSuccess}}
<div class="alert alert-success alert-dismissible fade show" role="alert">
    <i class="bi bi-check-circle-fill"></i> {{.FlashSuccess}}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
{{end}}
{{if .FlashWarning}}
<div class="alert alert-warning alert-dismissible fade show" role="alert">
    <i class="bi bi-exclamation-circle-fill"></i> {{.FlashWarning}}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
{{end}}
{{if .FlashError}}
<div class="alert alert-danger alert-dismissible fade show" role="alert">
    <i class="bi bi-exclamation-triangle-fill"></i> {{.FlashError}}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
{{end}}
{{with index .Errors "_form"}}
<div class="alert alert-danger"><i class="bi bi-x-octagon-fill"></i> {{.}}</div>
{{end}}
