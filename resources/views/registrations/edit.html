<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/registrations">Pendaftar</a></li>
        <li class="breadcrumb-item active">Ubah {{.Registration.Name}}</li>
    </ol>
</nav>

<div class="card border-0 shadow-sm">
    <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <h1 class="h5 mb-0">Ubah Pendaftar</h1>
        <span>Kode tiket: <code>{{.Registration.TicketCode}}</code></span>
    </div>
    <div class="card-body">
        <form method="POST" action="/registrations/{{.Registration.ID}}" novalidate>
            <input type="hidden" name="_method" value="PUT">
            {{template "registrations/_form" .}}
            <div class="mt-4">
                <a href="/registrations" class="btn btn-secondary">Batal</a>
                <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Simpan Perubahan</button>
            </div>
        </form>
    </div>
</div>
