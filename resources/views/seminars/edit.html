<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/seminars">Seminar</a></li>
        <li class="breadcrumb-item"><a href="/seminars/{{.Seminar.ID}}">{{.Seminar.Title}}</a></li>
        <li class="breadcrumb-item active">Ubah</li>
    </ol>
</nav>

<div class="card border-0 shadow-sm">
    <div class="card-header bg-white"><h1 class="h5 mb-0">Ubah Seminar</h1></div>
    <div class="card-body">
        <form method="POST" action="/seminars/{{.Seminar.ID}}" novalidate>
            <input type="hidden" name="_method" value="PUT">
            {{template "seminars/_form" .}}
            <div class="mt-4">
                <a href="/seminars" class="btn btn-secondary">Batal</a>
                <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Simpan Perubahan</button>
            </div>
        </form>
    </div>
</div>
